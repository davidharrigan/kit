# AeroSpace: i3-style bindings on vim keys, with AeroSpace's tree normalizations.
# Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

start-at-login = true
auto-reload-config = true

persistent-workspaces = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 4
gaps.inner.vertical = 8
gaps.outer.left = 2
gaps.outer.bottom = 8
gaps.outer.top = 0
gaps.outer.right = 2

after-startup-command = [
  """exec-and-forget /run/current-system/sw/bin/borders \
        hidpi=on \
        active_color=0xffe1e3e4 \
        inactive_color=0xff494d64 \
        width=3.0""",
]

# Ghostty's native tabs are separate windows to macOS. Ghostty documents this
# rule, with 'layout floating' as the fallback if tabs still split.
on-window-detected = [
  { if = "test %{app-bundle-id} = com.mitchellh.ghostty", run = "layout tiling" },
]

[mode.main.binding]
alt-enter = '''exec-and-forget osascript -e '
    tell application "Ghostty"
        new window
    end tell'
    '''

alt-h = "focus --boundaries-action wrap-around-the-workspace left"
alt-j = "focus --boundaries-action wrap-around-the-workspace down"
alt-k = "focus --boundaries-action wrap-around-the-workspace up"
alt-l = "focus --boundaries-action wrap-around-the-workspace right"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-f = "fullscreen"

alt-s = "layout v_accordion"  # 'layout stacking' in i3
alt-w = "layout h_accordion"  # 'layout tabbed' in i3
alt-e = "layout tiles horizontal vertical"  # 'layout toggle split' in i3

alt-shift-space = "layout floating tiling"  # 'floating toggle' in i3

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-0 = "workspace 10"
alt-o = "workspace o"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"
alt-shift-0 = "move-node-to-workspace 10"

alt-tab = "workspace-back-and-forth"

alt-shift-c = "reload-config"

alt-r = "mode resize"
alt-shift-semicolon = "mode service"
alt-shift-p = "mode passthrough"

[mode.resize.binding]
h = "resize width -50"
j = "resize height +50"
k = "resize height -50"
l = "resize width +50"
enter = "mode main"
esc = "mode main"

[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]  # reset layout
f = ["layout floating tiling", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

alt-shift-h = ["join-with left", "mode main"]
alt-shift-j = ["join-with down", "mode main"]
alt-shift-k = ["join-with up", "mode main"]
alt-shift-l = ["join-with right", "mode main"]

# Hands every alt chord to the focused app, for alt-heavy apps such as Blender.
[mode.passthrough.binding]
alt-shift-p = "mode main"
