# Tool-agnostic permission source of truth.
#
# List bare commands/patterns only -- NO Bash(...)/Read(...) wrapper, NO ":*".
# `permgen` adds the wrapper and the ":*".
#
# Wrapping rule for `bash` values:
#   - contains a "*"  -> used verbatim inside Bash(...)   e.g. "rm -rf /*"
#   - otherwise       -> ":*" appended                    e.g. git status -> Bash(git status:*)
# `read` values are wrapped as Read(...) verbatim (path globs, never ":*").
# `webfetch` values are wrapped as WebFetch(...) verbatim, e.g. "domain:github.com".
# `raw` values are passed through unwrapped, e.g. "WebSearch".

allow:
  bash:
    # docker (read-only)
    - docker ps
    - docker logs
    - docker inspect
    - docker images
    # git (read + local)
    - git status
    - git add
    - git commit -m
    - git commit -am
    - git commit --amend
    - git pull
    - git fetch
    - git log
    - git diff
    - git branch
    - git stash
    - git remote
    - git tag
    - git show
    - git blame
    - git init
    - git worktree
    - git rev-parse
    # file inspection
    - ls
    - ll
    - cat
    - less
    - more
    - head
    - tail
    - echo
    # search
    - grep
    - egrep
    - fgrep
    - rg
    - find
    # text processing
    - cut
    - sort
    - uniq
    - wc
    - diff
    - sed
    - tree
    - du
    # path helpers
    - cd
    - pwd
    - basename
    - dirname
    - realpath
    - readlink
    # data
    - jq
    - yq
    # system info
    - date
    - whoami
    - hostname
    - uname
    - which
    - whereis
    - id
    - groups
    - uptime
    # more text
    - tr
    - fold
    - column
    - paste
    - join
    # build / test runners
    - cargo
    - go
    - just
    - pnpm
    # herdr: inspect verbs only (inject verbs stay ask -- see `ask` below)
    - herdr agent list
    - herdr agent get
    - herdr agent read
    - herdr agent wait
    - herdr agent focus
    - herdr agent explain
    # misc
    - mktemp
    - mkdir
    - sleep
    - cmux
    - ~/.claude/skills/task/scripts/launch.sh
    - "* --version"
    - "* --help"
    # gh (read-only)
    - gh search
    - gh issue list
    - gh issue view
    - gh pr list
    - gh pr view
    - gh pr checks
    - gh pr diff
    - gh run view
    - gh run list
    - gh release list
    - gh release view
    - gh repo view
    # gh api: reads auto-approve here; writes are forced to prompt in `ask` below
    - gh api
  read:
    - //private/tmp/**
  webfetch:
    - domain:github.com
    - domain:raw.githubusercontent.com
  raw:
    - WebSearch

deny:
  bash:
    - sudo
    - doas
    - "rm -rf /"
    - "rm -rf /*"
    - mkfs
    - fdisk
    - diskutil eraseDisk
    - diskutil eraseVolume
    - "dd if=/dev/zero of=/dev/*"
    - "dd if=/dev/random of=/dev/*"
    - shutdown
    - reboot
    - halt
    - passwd
    - csrutil
    - spctl
    - nc -l
    - netcat -l
    - socat
    - masscan
    - "bash -i >& /dev/tcp/*"
    - "sh -i >& /dev/tcp/*"
    - "exec < /dev/tcp/*"
    - "exec > /dev/tcp/*"
    - "exec 3<>/dev/tcp/*"
    - "docker run --privileged *"
    - "docker run -v /:/host *"
    - "docker run -v /var/run/docker.sock:/var/run/docker.sock *"
    - "* ~/.aws/*"
    - "* ~/.ssh/id_*"
    - "* ~/.gnupg/*"
    - "* ~/.azure/*"
    - "* ~/.config/gcloud/*"
    - "* ~/.kube/config*"
  read:
    - ~/.ssh/id_*
    - ~/.aws/**
    - ~/.gnupg/**
    - ~/.azure/**
    - ~/.config/gcloud/**
    - ~/.kube/config

ask:
  bash:
    # protected-branch / force pushes
    - git push origin main
    - git push origin master
    - git push upstream main
    - git push --force origin main
    - git push --force origin master
    - git push -f origin main
    - git push -f origin master
    - git push --force-with-lease origin main
    - git push --force-with-lease origin master
    - "git push * main*"
    - "git push * master*"
    # history / config rewrites
    - git reset
    - git config
    - git clone
    - git branch -d
    - git branch -D
    # - gh pr create
    # - gh pr merge
    - gh pr close
    - gh pr review
    # herdr inject verbs: drive another agent -- prompt before one agent
    # sends commands/keys/prompts into another. Inspect verbs are allowed above.
    # - herdr agent send-keys
    # - herdr agent prompt
    # - herdr agent start
    # - herdr agent rename
    # redirection / arbitrary shells
    - tee
    - split
    - csplit
    - sh
    - bash
    - zsh
    - eval
    # destructive / process control
    - rm -rf ~*
    - Bash(rm -rf $HOME*
    - Bash(rm -rf ..*
    - rm -rf .git*
    - kill
    - pkill
    - killall
    - nmap
    # env exfiltration
    - "env | base64*"
    - "printenv | base64*"
    - "set | base64*"
    # gh api writes are handled by the cmdhook.mjs policy hook (proper arg
    # parsing + per-repo endpoint allow), not fragile flag globs. See
    # dots/.claude/hooks/cmdhook.mjs. `gh api` reads still auto-approve via the
    # `allow` list above.
